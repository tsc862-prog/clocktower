<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clocktower</title>
  <link rel="stylesheet" href="/styles/page.css">
</head>
<body>
  <header id="gamebar" class="panel bar">
    <h1>Clocktower</h1>
    <span id="view-switch" class="view-switch" role="group" aria-label="Which view">
      <button data-view="people" aria-pressed="true" title="The characters as the main screen">People</button>
      <button data-view="table" aria-pressed="false" title="Every panel at once: the square, the talk, the grimoire, the Storyteller's log, the agents">Table</button>
    </span>
    <label class="field roles-switch" title="Show each character's true role on their card (only the Storyteller and you see them); off for a tenser watch"><input type="checkbox" id="roles-toggle" checked> roles</label>
    <label class="field" title="The seed of the next game; New game deals with it">seed <input id="seed" name="seed" size="6" inputmode="numeric"></label>
    <span id="rounds" class="dim"></span>
    <span id="phase" class="phase"></span>
    <span id="winner" class="winner" hidden></span>
    <p id="empty" class="empty">No game yet</p>
    <select id="frames" hidden title="Which moment of the recorded game"></select>
    <span id="source" class="source"></span>
    <label class="field pace" title="How far apart the runners' turns are; goes with the next start">pace <select id="pace" name="pace"></select></label>
    <span id="pace-note" class="dim pace-note"></span>
    <span id="art-note" class="dim art-note" hidden title="Token images (PNG or WebP) from your own folder, public/tokens-local; the drawn token wherever there is none"></span>
    <span id="voice" class="voice" data-state="off">
      <button id="voice-toggle" aria-pressed="false" title="Click to hear each line spoken (the local voice engine)">Voice: off</button>
      <button id="voice-skip" hidden disabled title="End the line playing">Skip</button>
      <button id="voice-mute" hidden title="Hush now and hold new lines until unmuted">Mute</button>
      <label class="field" hidden title="Also read the whispers the watcher sees (the table does not hear them)"><input type="checkbox" id="voice-whispers"> whispers</label>
      <label class="field" hidden title="Say who speaks before each line (and the room, or who a whisper is for)"><input type="checkbox" id="voice-names" checked> names</label>
      <span id="voice-time" class="voice-time" hidden title="The game lets a seat's next speaking turn wait a moment while the voices catch up: the page tells the relay what it has heard">keeping time</span>
      <span id="voice-note" class="dim voice-note" aria-live="polite"></span>
    </span>
    <span id="rooms-line" class="rooms-bar" hidden></span>
    <span class="grow"></span>
    <button id="bar-start-all" title="Start a runner for the Storyteller and every seat that has none">Start all</button>
    <span id="act-msg" class="dim" aria-live="polite"></span>
    <button id="new-game" disabled title="Needs the relay to start a new game over the wire">New game</button>
    <span id="relay-state" class="relay" data-state="not-connected">relay: checking...</span>
  </header>
  <div id="view">
  <section id="stage" aria-label="The people">
    <div class="stage-st"></div>
    <div class="table"><div class="table-centre" aria-live="polite"></div></div>
    <div class="recent" aria-label="The last lines"></div>
  </section>
  <nav id="drawer-tabs" aria-label="More">
    <button data-drawer="talk" aria-expanded="false">Talk</button>
    <button data-drawer="grimoire" aria-expanded="false">Grimoire</button>
    <button data-drawer="rulings" aria-expanded="false">Storyteller's log</button>
    <button data-drawer="agents" aria-expanded="false">Agents</button>
  </nav>
  <main id="board">
    <button class="drawer-close" title="Back to the people (Esc)">Close</button>
    <section id="square" class="panel" aria-label="The town square">
      <h2>The Square</h2>
      <div class="ring"><div class="centre"></div></div>
    </section>
    <section id="grimoire" class="panel" aria-label="The grimoire">
      <h2>Grimoire <small>as the Storyteller sees it</small></h2>
      <div class="seats"></div>
      <div class="grim-foot"></div>
    </section>
    <section id="talk" class="panel log" aria-label="The day's talk">
      <h2>The day's talk
        <label class="opt"><input type="checkbox" name="told" checked> what each seat is told</label>
        <label class="opt"><input type="checkbox" name="asides" checked> runners' asides</label>
      </h2>
      <div class="lines" tabindex="0"></div>
      <button class="follow" hidden>Follow the newest</button>
    </section>
    <section id="rulings" class="panel log" aria-label="The Storyteller's log">
      <h2><img class="st-portrait" hidden alt="" draggable="false">Storyteller's log <small>every call and its reason</small></h2>
      <div class="lines" tabindex="0"></div>
      <button class="follow" hidden>Follow the newest</button>
    </section>
    <section id="agents" class="panel" aria-label="Agents">
      <h2>Agents</h2>
      <div class="agents-top">
        <div class="pools"></div>
        <div class="agents-buttons">
          <button data-act="start-all">Start all</button>
          <button data-act="stop-all">Stop all</button>
          <button data-act="resume" class="resume" hidden title="The Storyteller's runner is gone: let the scripted Storyteller answer from here on">Resume the game</button>
        </div>
        <p class="agents-note"></p>
      </div>
      <div class="agent-rows"></div>
    </section>
  </main>
  </div>
  <script type="module" src="/src/ui/main.js"></script>
</body>
</html>
